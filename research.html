<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Research - Federica Marini</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Infant:wght@400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: "Courier New", monospace;
            background-color: #b3e5fc;
            margin: 0;
            padding: 40px;
            color: navy;
            line-height: 1.6;
        }

        h1 {
            font-size: 2.5em;
            margin-top: 50px;
            font-weight: normal;
            color: navy;
        }

        h2 {
            font-size: 1.8em;
            font-weight: normal;
            margin-top: 40px;
            color: navy;
        }

        .thesis-viewer {
            max-width: 1000px;
            margin: 0 auto;
        }

        p {
            font-size: 1.2em;
            margin: 20px 0;
            color: navy;
        }

        img {
            width: 400px;
            height: auto;
            display: block;
            margin: 40px 0;
        }

        .quote {
            font-size: 1.2em;
            color: navy;
        }

        /* Standardized Navigation Styles */
        .navigation {
            margin: 30px 0;
        }

        .button {
            display: inline-block;
            margin: 20px 20px 20px 0;
            font-size: 1.2em;
            color: navy;
            text-decoration: none;
            border-bottom: 1px solid navy;
        }

        .button:hover {
            opacity: 0.7;
        }

        /* Additional thesis-specific styles */
        .thesis-content {
            max-width: 1000px;
            margin: 0 auto;
            text-align: left;
            padding: 20px;
        }

        .section {
            margin-bottom: 40px;
        }

        .toc-list {
            list-style-type: none;
            padding-left: 0;
        }

        .toc-list li {
            margin: 10px 0;
            font-size: 1.1em;
        }

        .toc-list a {
            color: navy;
            text-decoration: none;
        }

        .toc-list a:hover {
            text-decoration: underline;
        }

        .page-number {
            float: right;
            color: #666;
        }

        .chapter-title {
            display: inline-block;
        }

        .back-button-container {
    display: flex;
    justify-content: center; /* Center the button horizontally */
    align-items: center;    /* Center the button vertically */
    margin: 80px;           /* Add spacing around the button */
}

        .back-button {
    background-color: transparent; /* Make the button background transparent */
    border: 2px solid currentColor; /* Circular border matches the text color */
    border-radius: 100%; /* Makes the button circular */
    padding: 20px 25px; /* Adjust button size */
    font-size: 1.2em; /* Text size */
    font-family: "Courier New", monospace;
    cursor: pointer; /* Pointer cursor on hover */
    color: navy; /* Text and border color (adjust as needed) */
    transition: all 0.3s ease; /* Add a smooth hover effect */
}

.back-button:hover {
    opacity: 0.5;
}

.currently-reading {
    border: 1px solid navy;
    border-radius: 8px;
    padding: 20px 25px;
    max-width: 500px;
    margin: 20px 0 40px 0;
}

.reading-status {
    font-size: 1.1em;
    margin: 0 0 8px 0;
}

.status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background-color: #4caf50;
    border-radius: 50%;
    margin-right: 8px;
    vertical-align: middle;
}

.last-updated {
    font-size: 0.85em;
    color: #666;
    margin: 0;
}

    </style>
</head>
<body>
    <main>
        <nav class="navigation">
            <a href="index.html" class="button">Home</a>
            <a href="about.html" class="button">About</a>
            <a href="archive.html" class="button">Archive</a>
            <a href="research.html" class="button">Research</a>
            <a href="pp/pp.html" class="button">Personal Projects</a>
            <a href="links.html" class="button">Inspiration</a>
        </nav>

        <div class="container">
            <h2>Currently Reading</h2>
            <div class="currently-reading">
                <p class="reading-status">
                    <span class="status-dot"></span>
                    <em>It's Not That Radical: Climate Action to Transform Our World</em> — Mikaela Loach
                </p>
                <p class="last-updated">Updated: August 2026</p>
            </div>
        </div>
    
        <div class="back-button-container">
            <button class="back-button" onclick="history.back()">Back</button>
        </div>

    </main>

</body>
</html>
