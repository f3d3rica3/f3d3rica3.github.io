<!DOCTYPE html>
<html lang="en">
<head>

    <title>Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="stylenav.css">

</head>
<body>

    <div class="navigation">
            <a href="index.html" class="button">Home</a>
            <a href="about.html" class="button">About</a>

            <a href="research.html" class="button">Research</a>
            <a href="pp/pp.html" class="button">Personal Projects</a>
            <a href="links.html" class="button">Inspiration</a>
        </div>

    <h1>Photo Gallery</h1>

    <div id="galleries"></div>

    <div class="back-button-container">
        <button class="back-button" onclick="history.back()">Back</button>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script>
        <!-- ============================================================
             HOW TO MANAGE THIS GALLERY (no code needed):
             ADD    -> upload a photo into one of the folders below
                       (github.com -> folder -> Add file -> Upload)
             DELETE -> delete the photo file from the folder
             ORDER  -> add an "order.txt" file to the folder containing
                       the filenames one per line, in the order you want.
                       Photos not listed appear at the end, alphabetical.
        ============================================================= -->
        const GALLERIES = [
            { title: "Summer in NYC", folder: "assets/summer in nyc" },
            { title: "Umbria", folder: "assets/fontanaro" },
            { title: "Milanooo", folder: "assets/milano" },
            { title: "All Over", folder: "assets/misc" },
        ];

        const REPO = "f3d3rica3/f3d3rica3.github.io";
        const BRANCH = "main";
        const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];

        function isImage(name) {
            const lower = name.toLowerCase();
            return IMAGE_EXTENSIONS.some(ext => lower.endsWith(ext));
        }

        async function loadOrder(folder) {
            const res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(folder).replace(/%2F/g, "/")}/order.txt`);
            if (!res.ok) return null;
            const text = await res.text();
            const list = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            return list.length ? list : null;
        }

        async function loadGallery(g) {
            const apiURL = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(g.folder).replace(/%2F/g, "/")}?ref=${BRANCH}`;
            const res = await fetch(apiURL);
            if (!res.ok) throw new Error(`Could not list ${g.folder}`);
            const files = (await res.json())
                .filter(f => f.type === "file" && isImage(f.name));
            const order = await loadOrder(g.folder);
            if (order) {
                files.sort((a, b) => {
                    const ia = order.indexOf(a.name), ib = order.indexOf(b.name);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                    return a.name.localeCompare(b.name, undefined, { numeric: true });
                });
            } else {
                files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            }
            return files
                .map(f => `<img loading="lazy" src="${f.download_url}" alt="${g.title} - ${f.name}">`)
                .join("\n            ");
        }

        async function render() {
            const root = document.getElementById("galleries");
            for (const g of GALLERIES) {
                const section = document.createElement("section");
                const h2 = document.createElement("h2");
                h2.textContent = g.title;
                const div = document.createElement("div");
                div.className = "gallery";
                section.appendChild(h2);
                section.appendChild(div);
                root.appendChild(section);
                try {
                    div.innerHTML = await loadGallery(g);
                } catch (e) {
                    div.innerHTML = "<p>Couldn't load this gallery.</p>";
                }
            }
        }

        render();
    </script>

    <script src="script.js"></script>

</body>
</html>
