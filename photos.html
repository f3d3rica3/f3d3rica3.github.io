<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="stylenav.css">

    <style>
        .collection-list {
            max-width: 700px;
            margin: 60px auto;
            text-align: center;
        }

        .collection-list a {
            display: block;
            color: navy;
            text-decoration: none;
            margin: 80px 0;
            transition: opacity 0.25s ease;
        }

        .collection-list a:hover {
            opacity: 0.8;
        }

        .collection-cover {
            width: min(620px, 100%);
            height: auto;
            display: block;
            margin: 0 auto 24px auto;
        }

        .collection-title {
            font-family: "Cormorant Infant", serif;
            font-size: 2.2em;
            display: block;
        }

        .collection-count {
            font-family: "Courier New", monospace;
            font-size: 0.75em;
            letter-spacing: 2px;
            opacity: 0.6;
            display: block;
            margin-top: 6px;
        }

        #gallery-view {
            display: none;
        }

        .back-to-collections {
            display: inline-block;
            margin: 10px 0 0 0;
            font-size: 1.1em;
            color: navy;
            text-decoration: none;
            border-bottom: 1px solid navy;
        }

        .back-to-collections:hover {
            opacity: 0.7;
        }

        /* single-collection view: default flex (poolside etc.) */
        #gallery-view .gallery {
            display: flex;
            flex-wrap: wrap;
            gap: 28px;
            justify-content: center;
            max-width: 900px;
            margin: 40px auto;
        }

        #gallery-view .gallery img {
            display: block;
            flex: 0 0 auto;
            object-fit: cover;
            cursor: pointer;
            height: 300px;
            width: auto;
        }

        /* Two-column grid for 4 or 6 photo collections */
        #gallery-view .gallery.two-col {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        #gallery-view .gallery.two-col img {
            width: 100%;
            height: auto;
        }

        /* Rooftop: cover extra big on top, then 2x2 grid below */
        #gallery-view .gallery.rooftop {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
        }
        #gallery-view .gallery.rooftop img:first-child {
            grid-column: span 2;
            width: 100%;
            height: auto;
        }
        #gallery-view .gallery.rooftop img {
            width: 100%;
            height: auto;
        }

        /* Barbacue: cover tall on left spanning 3 landscape heights, 3 landscapes stacked right, last 2 in bottom row */
        #gallery-view .gallery.barbacue {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 28px;
            max-width: 1050px; /* a bit wider so portrait cover fits without cropping */
        }
        #gallery-view .gallery.barbacue img:nth-child(1) {
            grid-column: 1;
            grid-row: 1 / span 3;
            width: 100%;
            height: 100%;
            object-fit: contain;
            align-self: start;
            background: transparent;
        }
        #gallery-view .gallery.barbacue img:nth-child(2) { grid-column: 2; grid-row: 1; width: 100%; height: auto; }
        #gallery-view .gallery.barbacue img:nth-child(3) { grid-column: 2; grid-row: 2; width: 100%; height: auto; }
        #gallery-view .gallery.barbacue img:nth-child(4) { grid-column: 2; grid-row: 3; width: 100%; height: auto; }
        #gallery-view .gallery.barbacue img:nth-child(5) { grid-column: 1; grid-row: 4; width: 100%; height: auto; }
        #gallery-view .gallery.barbacue img:nth-child(6) { grid-column: 2; grid-row: 4; width: 100%; height: auto; }

        @media (max-width: 640px) {
            .collection-list a { font-size: 1.9em; }
            #gallery-view .gallery { gap: 16px; max-width: 100%; }
            #gallery-view .gallery img { height: 200px; }
            #gallery-view .gallery.two-col,
            #gallery-view .gallery.rooftop,
            #gallery-view .gallery.barbacue {
                gap: 16px;
            }
            #gallery-view .gallery.barbacue img:nth-child(1) {
                grid-column: span 2;
                grid-row: auto;
                height: auto;
            }
            #gallery-view .gallery.barbacue img:nth-child(2),
            #gallery-view .gallery.barbacue img:nth-child(3),
            #gallery-view .gallery.barbacue img:nth-child(4),
            #gallery-view .gallery.barbacue img:nth-child(5),
            #gallery-view .gallery.barbacue img:nth-child(6) {
                grid-column: auto;
                grid-row: auto;
            }
        }
    </style>
</head>
<body>

    <div class="navigation">
            <a href="index.html" class="button">Home</a>
            <a href="about.html" class="button">About</a>
            <a href="archive.html" class="button">Archive</a>
            <a href="pp/pp.html" class="button">Personal Projects</a>
            <a href="links.html" class="button">Inspiration</a>
        </div>

    <div id="index-view">
        <h1>Photo Gallery</h1>
        <div id="collection-list" class="collection-list"></div>
    </div>

    <div id="gallery-view">
        <p><a href="#" id="back-link" class="back-to-collections">&larr; all collections</a></p>
        <div id="single-gallery" class="gallery"></div>
    </div>

    <div class="back-button-container">
        <button class="back-button" onclick="history.back()">Back</button>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script src="script.js"></script>

    <script>
        // ============================================================
        // HOW TO CURATE COLLECTIONS & MANAGE PHOTOS (no code needed):
        //   ADD COLLECTION    -> create a folder in assets/ and add one
        //                        line to the GALLERIES list below.
        //   REMOVE COLLECTION -> delete its line from GALLERIES
        //                        (or empty the folder of photos).
        //   RENAME COLLECTION -> change its title below.
        //   ADD PHOTO         -> upload it into the collection's folder.
        //   DELETE PHOTO      -> delete the file from the folder.
        //   ORDER PHOTOS      -> "order.txt" inside the folder, one
        //                        filename per line, top to bottom.
        //   COVER PHOTO       -> "cover.txt" inside the folder containing
        //                        the filename of the photo to use as the
        //                        collection cover. Defaults to first photo.
        //
        // After adding/removing photos, the manifest must be refreshed:
        //   python3 update-gallery-manifest.py   (or just ask opencode)
        // ============================================================
        const GALLERIES = [
            { title: "Rooftop", folder: "assets/rooftop" },
            { title: "Calcio", folder: "assets/calcio" },
            { title: "Wheat", folder: "assets/wheat" },
            { title: "Travelin", folder: "assets/travelin" },
            { title: "Night Tide", folder: "assets/night tide" },
            { title: "Barbacue", folder: "assets/barbacue" },
            { title: "Poolside", folder: "assets/poolside" },
        ];

        const REPO = "f3d3rica3/f3d3rica3.github.io";
        const BRANCH = "main";
        const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];

        window.__galleries = [];

        function isImage(name) {
            const lower = name.toLowerCase();
            return IMAGE_EXTENSIONS.some(ext => lower.endsWith(ext));
        }

        async function loadTextFile(folder, name) {
            const res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(folder).replace(/%2F/g, "/")}/${name}`);
            if (!res.ok) return null;
            const text = await res.text();
            const list = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            return list.length ? list : null;
        }

        let MANIFEST = null;

        async function loadManifest() {
            if (MANIFEST) return MANIFEST;
            const res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/gallery-manifest.json?t=${Date.now()}`);
            if (!res.ok) throw new Error("Could not load gallery manifest");
            MANIFEST = await res.json();
            return MANIFEST;
        }

        function fileURL(folder, name) {
            return `https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(folder).replace(/%2F/g, "/")}/${encodeURIComponent(name)}`;
        }

        async function loadGallery(g) {
            const manifest = await loadManifest();
            const files = (manifest[g.folder] || [])
                .filter(f => isImage(f));
            const order = await loadTextFile(g.folder, "order.txt");
            if (order) {
                files.sort((a, b) => {
                    const ia = order.indexOf(a), ib = order.indexOf(b);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                    return a.localeCompare(b, undefined, { numeric: true });
                });
            } else {
                files.sort((a, b) => a.localeCompare(b, undefined, { numeric: true }));
            }
            return files.map(f => fileURL(g.folder, f));
        }

        function showIndex() {
            document.getElementById("gallery-view").style.display = "none";
            document.getElementById("index-view").style.display = "block";
            const bb = document.querySelector(".back-button-container");
            if (bb) bb.style.display = "flex";
            window.scrollTo(0, 0);
        }

        function showCollection(gi) {
            const gal = window.__galleries[gi];
            if (!gal) return;
            window.__currentFolder = GALLERIES[gi].folder;
            const bb = document.querySelector(".back-button-container");
            if (bb) bb.style.display = "none";
            document.getElementById("index-view").style.display = "none";
            document.getElementById("single-gallery").innerHTML = gal.images.map((u, i) =>
                `<img loading="lazy" src="${u}" data-g="${gi}" data-i="${i}" alt="${gal.title} - photo ${i + 1}">`
            ).join("\n            ");
            document.getElementById("gallery-view").style.display = "block";
            window.scrollTo(0, 0);
            waitAndLayout();
        }

        function layoutGallery() {
            const gallery = document.getElementById("single-gallery");
            const folder = window.__currentFolder || "";
            const imgs = [...gallery.querySelectorAll("img")];
            if (!imgs.length) return;
            // reset classes and inline sizes
            gallery.className = "gallery";
            imgs.forEach(img => { img.style.width = ""; img.style.height = ""; });

            if (folder === "assets/rooftop") {
                gallery.classList.add("rooftop");
                return;
            }
            if (folder === "assets/barbacue") {
                gallery.classList.add("barbacue");
                return;
            }
            if (folder === "assets/calcio" || folder === "assets/wheat" || folder === "assets/travelin" || folder === "assets/night tide") {
                gallery.classList.add("two-col");
                return;
            }
            // generic: collections of 4 or 6 keep two columns
            if (imgs.length === 4 || imgs.length === 6) {
                gallery.classList.add("two-col");
                return;
            }
            // default (e.g. poolside 7): flex, no shrinking, generous gap
            const isMobile = window.innerWidth < 640;
            const targetH = isMobile ? 200 : 300;
            imgs.forEach(img => {
                const aspect = (img.naturalWidth && img.naturalHeight) ? img.naturalWidth / img.naturalHeight : 1.5;
                img.style.height = targetH + "px";
                img.style.width = Math.round(aspect * targetH) + "px";
            });
        }

        function waitAndLayout() {
            const gallery = document.getElementById("single-gallery");
            const imgs = [...gallery.querySelectorAll("img")];
            if (!imgs.length) return;
            let pending = imgs.length;
            const done = () => { pending--; if (pending <= 0) layoutGallery(); };
            imgs.forEach(img => {
                if (img.complete && img.naturalWidth) done();
                else {
                    img.addEventListener("load", done, { once: true });
                    img.addEventListener("error", done, { once: true });
                }
            });
            setTimeout(layoutGallery, 800);
        }

        let _layoutTimer;
        window.addEventListener("resize", () => {
            clearTimeout(_layoutTimer);
            _layoutTimer = setTimeout(() => {
                if (document.getElementById("gallery-view").style.display !== "none") layoutGallery();
            }, 100);
        });

        async function render() {
            const list = document.getElementById("collection-list");
            for (let gi = 0; gi < GALLERIES.length; gi++) {
                const g = GALLERIES[gi];
                try {
                    const urls = await loadGallery(g);
                    const coverName = (await loadTextFile(g.folder, "cover.txt") || [null])[0];
                    const cover = urls.find(u => u.endsWith("/" + encodeURIComponent(coverName))) || urls[0];
                    window.__galleries.push({ title: g.title, images: urls, cover });
                    const a = document.createElement("a");
                    a.href = "#";
                    a.innerHTML =
                        `<img class="collection-cover" src="${cover}" alt="${g.title} - cover photo">` +
                        `<span class="collection-count">${urls.length} photos</span>`;
                    a.addEventListener("click", (e) => { e.preventDefault(); showCollection(gi); });
                    list.appendChild(a);
                } catch (e) {
                    const p = document.createElement("p");
                    p.textContent = g.title + " - couldn't load";
                    list.appendChild(p);
                }
            }
        }

        document.getElementById("back-link").addEventListener("click", function (e) {
            e.preventDefault();
            showIndex();
        });

        render();
    </script>

</body>
</html>
