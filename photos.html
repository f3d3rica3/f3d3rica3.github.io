<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="stylenav.css">

</head>
<body>

    <div class="navigation">
            <a href="index.html" class="button">Home</a>
            <a href="about.html" class="button">About</a>
            <a href="archive.html" class="button">Archive</a>
            <a href="research.html" class="button">Research</a>
            <a href="pp/pp.html" class="button">Personal Projects</a>
            <a href="links.html" class="button">Inspiration</a>
        </div>

    <h1>Photo Gallery</h1>

    <div id="collection-nav" class="collection-nav"></div>

    <div id="galleries"></div>

    <div class="back-button-container">
        <button class="back-button" onclick="history.back()">Back</button>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox" onclick="closeLightbox(event)">
        <img class="lightbox-content" id="lightbox-img">
    </div>

    <script>
        // ============================================================
        // HOW TO CURATE COLLECTIONS & MANAGE PHOTOS (no code needed):
        //   ADD COLLECTION    -> create a folder in assets/ and add one
        //                        line to the GALLERIES list below.
        //   REMOVE COLLECTION -> delete its line from GALLERIES
        //                        (or empty the folder of photos).
        //   RENAME COLLECTION -> change its title below.
        //   ADD PHOTO         -> upload it into the collection's folder.
        //   DELETE PHOTO      -> delete the file from the folder.
        //   ORDER PHOTOS      -> "order.txt" inside the folder, one
        //                        filename per line, top to bottom.
        // ============================================================
        const GALLERIES = [
            { title: "Summer in NYC", folder: "assets/summer in nyc" },
            { title: "Umbria", folder: "assets/fontanaro" },
            { title: "Calcio", folder: "assets/calcio" },
            { title: "All Over", folder: "assets/misc" },
        ];

        const REPO = "f3d3rica3/f3d3rica3.github.io";
        const BRANCH = "main";
        const IMAGE_EXTENSIONS = [".jpg", ".jpeg", ".png", ".gif", ".webp", ".avif"];

        window.__galleries = [];

        function isImage(name) {
            const lower = name.toLowerCase();
            return IMAGE_EXTENSIONS.some(ext => lower.endsWith(ext));
        }

        async function loadOrder(folder) {
            const res = await fetch(`https://raw.githubusercontent.com/${REPO}/${BRANCH}/${encodeURIComponent(folder).replace(/%2F/g, "/")}/order.txt`);
            if (!res.ok) return null;
            const text = await res.text();
            const list = text.split("\n").map(l => l.trim()).filter(l => l.length > 0);
            return list.length ? list : null;
        }

        async function loadGallery(g) {
            const apiURL = `https://api.github.com/repos/${REPO}/contents/${encodeURIComponent(g.folder).replace(/%2F/g, "/")}?ref=${BRANCH}`;
            const res = await fetch(apiURL);
            if (!res.ok) throw new Error(`Could not list ${g.folder}`);
            const files = (await res.json())
                .filter(f => f.type === "file" && isImage(f.name));
            const order = await loadOrder(g.folder);
            if (order) {
                files.sort((a, b) => {
                    const ia = order.indexOf(a.name), ib = order.indexOf(b.name);
                    if (ia !== -1 && ib !== -1) return ia - ib;
                    if (ia !== -1) return -1;
                    if (ib !== -1) return 1;
                    return a.name.localeCompare(b.name, undefined, { numeric: true });
                });
            } else {
                files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
            }
            return files.map(f => f.download_url);
        }

        async function render() {
            const root = document.getElementById("galleries");
            const nav = document.getElementById("collection-nav");
            for (let gi = 0; gi < GALLERIES.length; gi++) {
                const g = GALLERIES[gi];
                const section = document.createElement("section");
                section.id = "gallery-" + gi;
                const h2 = document.createElement("h2");
                h2.textContent = g.title;
                const div = document.createElement("div");
                div.className = "gallery";
                section.appendChild(h2);
                section.appendChild(div);
                root.appendChild(section);

                try {
                    const urls = await loadGallery(g);
                    window.__galleries.push({ title: g.title, images: urls });
                    div.innerHTML = urls.map((u, i) =>
                        `<img loading="lazy" src="${u}" data-g="${gi}" data-i="${i}" alt="${g.title} - photo ${i + 1}">`
                    ).join("\n            ");
                } catch (e) {
                    div.innerHTML = "<p>Couldn't load this gallery.</p>";
                }

                const link = document.createElement("a");
                link.href = "#gallery-" + gi;
                link.textContent = g.title;
                nav.appendChild(link);
            }
        }

        render();
    </script>

    <script src="script.js"></script>

</body>
</html>
